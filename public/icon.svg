<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0914"/>
      <stop offset="50%" stop-color="#150f28"/>
      <stop offset="100%" stop-color="#07060c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Speaker Sub Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2a1f4a" stroke-width="12" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neon)" stroke-width="6" opacity="0.8" filter="url(#shadow)"/>
  
  <!-- Dubstep Wub Wave Bars -->
  <g transform="translate(136, 156)" fill="url(#glow)">
    <rect x="0" y="70" width="16" height="60" rx="8"/>
    <rect x="28" y="45" width="16" height="110" rx="8"/>
    <rect x="56" y="20" width="16" height="160" rx="8"/>
    <rect x="84" y="5" width="16" height="190" rx="8"/>
    <rect x="112" y="35" width="16" height="130" rx="8"/>
    <rect x="140" y="60" width="16" height="80" rx="8"/>
    <rect x="168" y="10" width="16" height="180" rx="8"/>
    <rect x="196" y="40" width="16" height="120" rx="8"/>
    <rect x="224" y="65" width="16" height="70" rx="8"/>
  </g>
  
  <!-- Center Bass Core -->
  <circle cx="256" cy="256" r="28" fill="#00f2fe" opacity="0.9" filter="url(#shadow)"/>
  <polygon points="250,244 268,256 250,268" fill="#0b0914"/>
</svg>
